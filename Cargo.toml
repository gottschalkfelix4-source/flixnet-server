[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
flixnet-core = { path = "crates/flixnet-core" }
flixnet-api = { path = "crates/flixnet-api" }
flixnet-db = { path = "crates/flixnet-db" }
flixnet-library = { path = "crates/flixnet-library" }
flixnet-media = { path = "crates/flixnet-media" }
flixnet-jellyfin = { path = "crates/flixnet-jellyfin" }
flixnet-livetv = { path = "crates/flixnet-livetv" }
flixnet-llm = { path = "crates/flixnet-llm" }

anyhow = "1"
base64 = "0.22"
argon2 = "0.6"
getrandom = "0.3"
sha2 = "0.11"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
flate2 = "1"
figment = { version = "0.10", features = ["toml", "env"] }
hex = "0.4"
blurhash = "0.2"
hmac = "0.13"
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "builder", "tokio1", "tokio1-rustls", "ring", "webpki-roots"] }
lofty = "0.25"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "rayon"] }
notify = "8.2"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "charset", "http2", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
strsim = "0.11"
wiremock = "0.6"
http-body-util = "0.1"
ring = "0.17"
rust-embed = { version = "8.13", features = ["mime-guess"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "macros", "migrate", "json"] }
sysinfo = { version = "0.40", default-features = false, features = ["system", "disk"] }
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["trace", "compression-br", "compression-gzip", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
walkdir = "2"
utoipa = "6"
utoipa-axum = "0.3"
utoipa-scalar = { version = "0.4", features = ["axum"] }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

# Dependencies compiled with optimizations even in dev builds (faster media/AI code paths later).
[profile.dev.package."*"]
opt-level = 2
